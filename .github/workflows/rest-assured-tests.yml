name: REST Assured API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run REST Assured tests
        run: mvn -B -ntp clean test

      - name: Generate HTML test report
        if: always()
        run: mvn -B -ntp org.apache.maven.plugins:maven-surefire-report-plugin:3.6.0:report-only

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-test-results
          path: |
            target/reports/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
