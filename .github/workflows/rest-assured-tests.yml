name: REST Assured API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: restful-booker-pages
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run REST Assured tests
        id: tests
        run: mvn -B -ntp clean test

      - name: Generate HTML test report
        if: always()
        run: mvn -B -ntp org.apache.maven.plugins:maven-surefire-report-plugin:3.6.0:report-only -Dproject.build.outputTimestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload downloadable test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rest-assured-test-results
          path: |
            target/reports/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare GitHub Pages report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p public
          if [ -d target/reports ]; then
            cp -R target/reports/. public/
          fi
          python3 - <<'PY'
          import datetime
          import html
          import os
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          timestamp = datetime.datetime.now(ZoneInfo('America/New_York')).strftime('%B %-d, %Y at %-I:%M:%S %p %Z')
          outcome = os.environ.get('TEST_OUTCOME', 'unknown')
          run_url = html.escape(os.environ['RUN_URL'], quote=True)
          report_file = Path('public/surefire.html')
          report_exists = report_file.exists()
          if report_exists:
            report_html = report_file.read_text(encoding='utf-8')
            # Maven's standalone report can contain a placeholder publication date.
            report_html = report_html.replace('1980-02-01', timestamp)
            # Link the project name to its real GitHub repository instead of a
            # relative site URL that GitHub Pages does not provide.
            report_html = re.sub(
            r'<a\b[^>]*>\s*restful-booker-rest-assured-java\s*</a>',
            '',
            report_html,
            flags=re.IGNORECASE,
            )
            # Hide the redundant project link in the Maven report.
            report_html = report_html.replace(
            '</head>',
            '<style>a[href*="github.com/kwanjul/restful-booker-rest-assured-java"]'
            '{display:none !important;}</style></head>'
            )          
            report_file.write_text(report_html, encoding='utf-8')
          details = '<iframe title="Surefire HTML report" src="surefire.html"></iframe>' if report_exists else '<p>The HTML report could not be generated. Check the workflow logs and downloadable artifacts.</p>'
          Path('public/index.html').write_text(f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>REST Assured API Test Results</title>
            <style>
              body {{ font-family: system-ui, sans-serif; margin: 0; color: #202124; background: #f6f8fa; }}
              header {{ padding: 22px 28px; background: white; border-bottom: 1px solid #ddd; }}
              h1 {{ margin: 0 0 10px; font-size: 1.5rem; }}
              p {{ margin: 6px 0; }}
              iframe {{ display: block; width: 100%; height: 80vh; border: 0; background: white; }}
              a {{ color: #0969da; }}
            </style>
          </head>
          <body>
            <header>
              <h1>REST Assured API Test Results</h1>
              <p><strong>Report generated:</strong> {html.escape(timestamp)}</p>
              <p><strong>Test execution:</strong> {html.escape(outcome)}</p>
              <p><a href="{run_url}">View workflow run and download artifacts</a></p>
            </header>
            {details}
          </body>
          </html>''', encoding='utf-8')
          PY

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy latest report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v5
